<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>배열 메소드</title>
</head>
<body>
    <script>
        // 자바스크립트의 Array(배열)의 각종 Method
        let ranking=['Jason', 'Alice', 'Candy', 'Chris', 'Tom'];
        let arrTotal=['korea', 90, '2026-09-28'];

        // 1. pop() : 맨 마지막 요소 삭제, 맨 마지막 요소 삭제하고 반환한다.
        console.log(`pop()한 전 ranking 요소 : ${ranking}`);
        let poped = ranking.pop();
        console.log(`pop()한 요소 : ${poped}`);
        console.log(`pop()한 후 ranking 요소 : ${ranking}`);

        // 2. push(new data) : 맨 마지막에 새로운 데이터 추가
        ranking.push('David');
        console.log(`push()한 후 ranking 요소 : ${ranking}`)

        // 3. shift() : 맨 앞의 요소를 제거하고 반환
        console.log(`shift()전 ranking 요소 : ${ranking}`)
        let shifted = ranking.shift();
        console.log(`shift()한 후 shifted 요소 : ${shifted}`)
        console.log(`shift()한 후 ranking 요소 : ${ranking}`)

        // 4. unshift() : 맨 앞에 새로운 데이터를 추가
        ranking.unshift('Emma');
        console.log(`unshift()한 후 ranking 요소 : ${ranking}`)

        // 새로운 테스트를 위해 재할당한다.
        ranking=['Jason', 'Alice', 'Candy', 'Chris', 'Tom'];
        let number = [5, 1, 2, 4, 9];
        // 5. join(연결할 문자) : 요소와 요소사이를 연결
        let joinString = ranking.join('-');
        console.log(`join()한 후 ranking 요소 : ${joinString}`);
        // Jason-Alice-Candy-Chris-Tom 출력됨

        // 6. reverse() : 배열의 요소를 반대로
        ranking.reverse();
        console.log(`reverse()한 후 ranking 요소 : ${ranking}`);

        // 7. sort() : 기본 오름차순 정렬됨
        // ranking.sort();
        console.log(`sort()한 후 ranking 요소 : ${ranking}`);
        arrTotal.sort()
        console.log(`sort()한 후 arrTotal 요소 : ${arrTotal}`);

        // 내림차순 : sort((a,b) => b-a);
        ranking.sort((a,b) => b - a);
        number.sort((a,b) => b - a);
        console.log(`sort((a,b) => b-a)한 후 ranking 요소 : ${ranking}`);
        console.log(`sort((a,b) => b - a);${number}`);

        // 8. slice(시작인덱스번호, 끝 인덱스번호)
        //  지정한 시작 인덱스번호 ~ 끝 인덱스 번호까지의 구간을 잘라서
        //  새 배열로 생성한다.
        // slice(1, 3) : 인덱스 1 부터 ~ 인덱스 2까지만 정의된다.
        let sliced = ranking.slice(1, 3);
        console.log(`slice()한 후 slice 요소 : ${sliced}`);
        console.log(`slice()한 후 ranking 요소 : ${ranking}`);

        // 9. splice(시작인, 끝인, 아이템) : 특정 위치에 데이터 추가
        // 시작 : 2, 삭제할 개수 :1, 아이템: p
        let spliced = ranking.splice(1, 1, 'OK');
        console.log(`splice()한 후 ranking 요소 : ${spliced}`)
        console.log(`splice()한 후 ranking 요소 : ${ranking}`);

        // 10. concat() : 두 배열를 하나로 합쳐 새 배열 반환한다.
        let newRanking = ranking.concat('Sam', 'John');
        console.log(`concat()한 후 newranking 요소 : ${newRanking}`);
        console.log(`concat()한 후 ranking 요소 : ${ranking}`);

        // 11. indexof() : 특정 요소의 인덱스 위치를 반환, 단 없으면 -1 반환
        ranking=['Jason', 'Alice', 'Candy', 'Chris', 'Tom'];
        let index = ranking.indexOf('Alice');
        let index2 = ranking.indexOf('Tomcat');
        console.log(`Alice의 index번호 : ${index}`);
        console.log(`Tomcat의 index2번호 : ${index2}`);
        console.log(`ranking의 : ${ranking}`);

        // 12. include() : 특정한 값이 존재하면 true, 존재하지 않으면 false
        let hasTom = ranking.indexOf('Tom');
        let hasJake = ranking.indexOf('Jake');
        console.log(`Tom의 유무 : ${hasTom}`);
        console.log(`Jake의 유무 : ${hasJake}`);

    </script>
</body>
</html>
