<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Tree</title>
    <style>
        p.active {
            color: red;
            font-style: italic;
        }
    </style>



</head>
<body>
    <!-- 1) 문서 객체 모델(DOM, document Object Model)은
            xml, HTML 문서에 접근하기 위한 일종의 인터페이스이다.
      -->
    <h1>제목</h1>
    <p>본문</p>
    <h2 id="title">Hello</h2>
    <!-- 1) 요소노드(element) : h2
         2) 속성노드 : id=title
         3) 텍스트노드 : "Hello"
     -->
    <p id="test01">test01</p>
    <p class="test02">test02</p>
    <p class="test02">test03</p>
    <p class="test04"><span class="spanTest04">test04</span></p>
    <h1 id="title02">안녕하세요.</h1>
    <img id="imgs" src="/images/coffee-pink.jpg" alt="핑크커피" width="200">

    <ul id="list">
        <li>기본항목</li>
        <li id="item">삭제될 항목</li>

    </ul>

    <p id="p1">this is a paragraph</p>
    <input type="button" onclick="changeStyle()" value="눌러보세요">



    <script>
        let elementNode01 = document.getElementById('test01');
        let elementNode02 = document.getElementsByClassName('test02')[0];
        let elementNode03 = document.getElementsByTagName('p')[1];

        console.log('요소노드01', elementNode01);
        console.log('요소노드02', elementNode02);
        console.log('요소노드03', elementNode03);

        let element04 = document.querySelector('.test04 .spanTest04')

        let element05 = document.querySelector('.test04');
        element05.setAttribute('id', '#stest04')
        console.log(element05);

        let idValue = element05.getAttribute('id');
        console.log(idValue);

        let img = document.querySelector('#imgs')
        img.setAttribute('src', '/images/coffee-gray.jpg');

        // 요소생성, 요소추가, 요소 삭제하는 메소드
        // 요소생성 : document.creataeElement('')
        // 요소추가 : appendChild
        // 요소삭제 : removeChild()
        let list = document.getElementById('list');
        let newLi = document.createElement('li');
        newLi.innerText = '새항목01';
        list.appendChild(newLi);
        console.log("list", list.children);
        // list라는 ul의 부모의 아이템이라는 자식요소 삭제
        document.getElementById('item').remove();
        //
        // function changeStyle() {
        //     document.getElementById('p1').style.color = 'red';
        //     document.getElementById('p1').style.fontStyle = 'italic';
        // }

        function changeStyle() {
            document.getElementById('p1').classList.toggle('active');
        }

    </script>

</body>
</html>
