<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스크립트 데이터 타입</title>
</head>
<body>
    <!-- <script></script> 사이에 스크립트 코드작성한다.
        <head></head> 또는 <body></body> 두 영역중 하나에 입력한다.
    -->

    <script>
    <!-- 변수선언시 사용하는 키워드 : var, let, const  -->
    // var 키워드 : 중복선언 가능, 재할당 가능
    // es6 버전 부터는 var을 사용하지 않는다.
    // 자바스크립트는 데이터 타입이 존재한다. 다만 선언하지 않는다.
        var title='book';
        console.log(title);

        var title='hello';
        console.log(title);

        title='music';
        console.log(title);

        //     let : 재선언은 안되고 재할당은 가능함
        let title_01='book2';
        console.log(title_01);

        title_01='html';
        console.log(title_01);
        const title_02='java' // title_02의 데이터 타입은 문자열(string)
        console.log(title_02)

        // const title_02='kkkk';
        // title_02 = 1231232

        let x=5, y=7; // 현재 x, y 데이터 타입은 정수
        x='java';
        console.log(typeof x);
        // 삼항연산자 : 조건식 ? 참이면 : 거짓이면
        let big = x>y ? x : y;
        console.log(big);

        // 자바스크립트는 null도 값이다.
        let user = null; // user 변수는 현재 비어있다.
        let user01 = 'NULL'; // NULL은 뭔지 몰라 오류 출력됨

        let Null = '헬로우';

        let a = 1;
        let b = 'k';
        console.log(a+b); //
        console.log(a*b); // NaN (Not a Number)
        console.log('');
        // 자바스크립트에서 변수와 문자를 자연스럽게 출력하는 기호
        // `(백틱)을 사용한다.
        // `a는${변수}이고, b는 ${b} 이다.`
        console.log(`a는 ${a} 이고, b는 ${b}이다. `)

    </script>
</body>
</html>
