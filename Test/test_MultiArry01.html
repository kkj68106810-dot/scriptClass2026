<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2차원 배열</title>

</head>
<body>

    <script>
        // 자바스크립트에서 2차원 배열은 기본적으로 존재하지 않는다.
        // 다만, 2차원 배열처럼 생성할 수 있는 여러가지 방법이 존재한다.
        // 1. 초기값을 할당하여 배열 생성하는 방법
        let arr = [
            ['a','b']       // 1행
            , ['c', 'd']    // 2행
            , ['e', 'f']    // 3행
            , ['g', 'h']    // 4행
            , ['i', 'j']    // 5행
        ];

        arr.forEach((item, idx) => {
            item.forEach((second, seIdx) => {
                console.log(`arr의 출력 : ${arr[idx][seIdx]}`);
            })
        })

        // 2. new Array(행)
        let arry02 = new Array(3)
        // 열은 for문 이용
        for(let i = 0; i < arry02.length; i++) {
            arry02[i] = new Array(3);
            for(let j = 0; j < arry02[i].length; j++) {
                arry02[i][j] = 5;
            }
        }

        for(let i = 0; i < arry02.length; i++) {
            for(let j = 0; j < arry02[i].length; j++) {
                console.log(`${[i]}, ${[j]}`)
            }
        }

        // es6(자바스크립트 6버전)을 지원하는 모든 브라우저라면 사용가능한 방법
        // Array.from(Array(2), () => new Array(3)
        const arry03 = Array.from(Array(6), () => new Array(7).fill(0));
        console.log(`arry03출력 : ${arry03}`);

        for(let i = 0; i < arry03.length; i++) {
            for(let j = 0; j < arry03[i].length; j++) {
                console.log(`arry03 : ${[i]}, ${[j]} : ${arry03[i][j]}`);
            }
        }

        // forEach() : 배열전용 메소드
        // forEach(value, index, arr) => 값, 인덱스, 배열전체 => 순서중요
        // call : 함수를 실행(호출) 하라
        // back: 나중에, 또는 제어권을 넘겨받은
        // 직접 함수()형태로 실행되는게 아니라, 제어권을 넘겨받은 다른 함수가
        // 나중에 호출되도록 만드는 것
        const tarry = [10, 20, 30]
        arr.forEach((value, index, array)=>{
            console.log(array)
            // console.log()
            // console.log(`tarry의 value:${value}`);
            // console.log(`tarry의 index:${index}`);
            // // console.log(`${index} : ${value}`); // 0 : 10, 1 : 20, 2: 30 출력
            // console.log(`${array}`);
        })

        // map() : 배열 순회하여 출력하는 메소드
        //         단, 새로운 배열로 반환된다.
        //          반드시 return 값을 이용하여 반환한다.
        let tarry02 = [1, 2, 3]
        let doubled = tarry02.map ((value, idx, arr) => {
            console.log(`tarry02값 ${value}`)
            return value*10;
        })
        console.log(doubled)
    </script>

</body>
</html>
