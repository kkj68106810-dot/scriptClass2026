<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Core 기초문제</title>
</head>
<body>
    <button onclick="showYear()">1. 현재년도 출력</button>
    <button onclick="showDay()">2. 오늘 요일 출력</button>
    <button onclick="showTime()">3. 현재 시간 출력</button>
    <button onclick="showDates02()">4. 하루 후, 일주일 후 날짜 출력</button>
    <button onclick="showWeekend()">5. 요일에 따른 메시지 출력</button>
    <div id="render"></div>

    <script>
        let today = new Date()
        let result;
        let weekEnd = ['일', '월', '화', '수', '목', '금', '토']
        // 1. 현재 연도 출력
        // 현재 날짜를 Date 객체로 가져와서 콘솔에 "올해는 2026년입니다." 형식으로 출력하세요.
        function showYear() {
            let year = today.getFullYear()
            result = `<p> 올해는 ${year}년 입니다.  </p>`
            printStr(result);
        }

        // 2. 오늘 요일 출력
        // 문제: 현재 날짜를 이용하여 오늘 요일을 한글로 출력하세요.
        // 예: "오늘은 화요일입니다."
        function showDay() {
            let day = weekEnd[today.getDay()];
            result = `<p> 오늘은 ${day}요일입니다.  </p>`
            printStr(result);
        }

        // 3. 현재 시간 출력
        // 문제: 현재 시간을 시:분:초 형식으로 출력하세요.
        // 예: "현재 시간: 14:35:20"
        function showTime() {
            let hour = today.getHours();
            let minute = today.getMinutes();
            let second = today.getSeconds();
            result = `<p> 현재 시간 :  ${hour} : ${minute} : ${second}  </p>`
            printStr(result);
        }

        // 4. 하루 후 일주일 후 날짜출력
        // 문제: 오늘 날짜를 기준으로 하루 후와 일주일 후 날짜를 출력하세요.
        function showDates(){
            let newDate = new Date();
            let nextDate = newDate.getDate() + 1;
            let nextWeek = newDate.getDate() + 7;

            let getReal1 = new Date(2026, 8, nextDate);
            let getReal2 = new Date(2026, 8, nextWeek);
            let getDateMonth1 = getReal1.getDate() < nextDate ? getReal1.getMonth() + 1 : getReal1.getMonth();
            let getWeekMonth2 = getReal2.getDate() < nextWeek ? getReal2.getMonth() + 1 : getReal2.getMonth();

            result = `<p> 내일은 ${getDateMonth1}월  ${getReal1.getDate()}일,
                        일주일 후는 ${getWeekMonth2}월 ${getReal2.getDate()}일  </p>`
            printStr(result);
        }


        function showDates02(){
            let today = new Date()

            // 내일
            let tomorrow = new Date(today);
            tomorrow.setDate(today.getDate() + 1);

            let nextWeek = new Date(today)
            nextWeek.setDate(today.getDate() + 7);
            result = `<p> 내일은 ${tomorrow.toLocaleString()} <br/>
                        일주일 후는 ${nextWeek.toLocaleString()}  </p>`
            printStr(result);
        }


        // 5. 요일에 따른 메시지 출력
        // 문제: 오늘 요일이 주말(토, 일)이면 "주말이에요!", 평일이면 "열심히 일하는 날!"을 출력하세요
        function showWeekend(){
            let weekEnd2 = weekEnd[today.getDay()];
            console.log(weekEnd2);
            result =  weekEnd2 ==='토' || weekEnd2 ==='일' ?  `<p> 주말이에요  </p>` : `<p>평일이에요</p>`
            printStr(result);
        }

        function printStr(result) {
            document.getElementById('render').innerHTML = result;
        }

    </script>

</body>
</html>
