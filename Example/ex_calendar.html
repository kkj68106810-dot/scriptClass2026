<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>달력이요</title>
    <style>
        .blue {
            color: blue;
        }
        .red {
            color: red;
        }
        .today {
            background-color: blue;
            color: white;
            border-radius: 50px;
        }
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: lightgray;
        }
        .container {
            margin-top : 100px;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .cal-container {
            /*box-shadow: 3px 3px 3px 3px lightgray;*/
            width: 500px;
            text-align: center;
            border-radius: 20px;
            border : 1px solid lightgray;
            padding : 15px 15px 50px 15px;
            background-color: white;

        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .content-container {
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .btn {
            background-color: lightgray;
            border-radius: 50px;
            width: 40px;
            height: 40px;
            border: 1px solid darkgray;
        }
        table {
            font-size: 15px;
        }
        td {
            width: 70px;
            height: 50px;
        }
    </style>
</head>
<body>
<div class="container">

    <div id="render" class="cal-container"></div>
</div>

<script>
    let arrs = Array.from(Array(7), () => new Array(7).fill(0));
    let date = new Date();
    let result = '';
    const weekdays = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    let presentYear = date.getFullYear();
    let presentMonth = date.getMonth();
    let presentDate = date.getDate();

    display(presentYear, presentMonth);

    // month는 1달전으로 취급함
    function display(year, month) {
        let getLastDate = lastDay(year, month);
        let getDay = new Date(year, month).getDay();
        let calNum = 1;

        result += `<div class="header"><button class="btn" onclick="beforeMonth(${year}, ${month})"> < </button>`
        result += `<h2>${year}년 ${month+1}월</h2>`
        result += `<button class="btn" onclick="afterMonth(${year}, ${month})"> > </button></div>`
        result += '<div class="content-container"><table><tbody><tr>'

        arrs.forEach((element, idx) => {
            element.forEach((element2, idx2) => {
                if (idx === 0) {
                    if(idx2===6) {
                        result += `<td class="blue">${weekdays[idx2]}</td>`
                    } else if (idx2===0) {
                        result += `<td class="red">${weekdays[idx2]}</td>`
                    } else {
                        result += `<td>${weekdays[idx2]}</td>`
                    }
                } else if (idx === 1) {
                    if (idx2 < getDay) {
                        result += `<td></td>`
                    } else if (idx2 >= getDay) {
                        console.log(presentMonth, month)
                        console.log(presentYear, year)
                        console.log(typeof month)
                        console.log(typeof year)
                        if( idx2 === 6) {
                            result += `<td class="blue">${calNum}</td>`;
                        } else if (idx2 === 0) {
                            result += `<td class="red">${calNum}</td>`;
                        } else if(calNum === presentDate && month === presentMonth && year === presentYear) {
                            result += `<td class="today">${calNum}</td>`;
                        } else {
                            result += `<td>${calNum}</td>`;
                        }
                        calNum++;
                    }
                } else if (idx >= 2) {
                    if (!(calNum > getLastDate)) {
                        if( idx2 === 6) {
                            result += `<td class="blue">${calNum}</td>`
                        } else if (idx2 === 0) {
                            result += `<td class="red">${calNum}</td>`
                        } else if(calNum === presentDate && month === presentMonth && year === presentYear) {
                            result += `<td class="today">${calNum}</td>`;
                        } else {
                            result += `<td>${calNum}</td>`
                        }
                        calNum++;
                    } else {
                        if(arrs[idx][idx2] === 0) {
                            result += ``;
                        } else {
                            result += `<td></td>`;
                        }
                    }
                }
            })
            result += '</tr></tbody>';
        })
        result += '</table></div>';
        document.getElementById('render').innerHTML = result;
    }


    function lastDay(year, month) {
        let returnDay = 0;
        let dayNum = [27, 28, 29, 30, 31, 32];
        dayNum.forEach(day => {
            let calDate = new Date(year, month, day).getDate();
            if (calDate === 1) {
                returnDay = day - 1;
            }
        })
        return returnDay;
    }

    function beforeMonth(year, month) {
        result = '';
        let before = month - 1
        if (before <0) {
            display(year-1, 11);
        } else if (0<=before <=11) {
            display(year, before);
        }
    }

    function afterMonth(year, month) {
        result = '';
        let after = month + 1
        if (after > 11) {
            display(year+1, 1);
        } else if (0<=after <=11) {
            display(year, after);
        }
    }

</script>
</body>
</html>
