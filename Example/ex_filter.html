<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>filter 메소드</title>
    <style>
        .container {
            width: 400px;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn">과일</button>
        <button class="btn">어류</button>
        <ul class="cart">

        </ul>
    </div>
    <script>
        let menu = [
            {id:0, name:'딸기', category:1},
            {id:1, name:'포토', category:1},
            {id:2, name:'바나나', category:1},
            {id:3, name:'고등어', category:2},
            {id:4, name:'조기', category:2},
            {id:5, name:'갈치', category:2},
        ]
        let btnList = document.querySelectorAll('.btn');
        let ul = document.querySelector('ul');
        let html = '';

        btnList.forEach((item, index) => {
            item.addEventListener('click', ()=> {
                render(index+1);
            })
        })

        function render(cateNum) {
            let filterMenu = menu.filter((item) => {
                return item.category === cateNum;
            })
            console.log(filterMenu)
            let result = ``;
            for(let i = 0; i < filterMenu.length; i++) {
                result += `<li> ${filterMenu[i].name}</li>`
            }
            ul.innerHTML = result;
        }


    </script>
</body>
</html>
