<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오브젝트 기초 연습문제</title>
</head>
<body>
    <div id="app"></div>
    <script>
        let student = {
            name : "홍길동",
            age : 20,
            major: "컴퓨터 공학"
        }
        console.log('학생정보 :', student);

        let car = {
            brand: 'hyundai',
            color: '흰색',
            price:2500
        }
        console.log('자동차 정보 : ', car)
        car.color = '검정색';
        car.price = 3000;
        console.log('자동차 정보 : ', car)

        // 식별자는 기본적으로 지정해서 쓰게됨, 데이터베이스의 기본키와 같은 역할을 한다.
        let item1 = { name: "노트북", price: 1000, quantity: 1 };
        let item2 = { name: "마우스", price: 50, quantity: 2 };
        let cart = [item1, item2];
        let total = 0;
        for(let i = 0; i < cart.length; i++) {
            total += cart[i].price*cart[i].quantity;
        }
        console.log(total);

        // ① 학생 3명의 정보를 객체로 만들고(name, kor, eng, math), 각 객체를 배열 students에 저장하시
        // 오. (단, 아래 자료 이용)
        // '홍길동', kor: 90, eng: 80, math: 85
        // '성춘향', kor: 95, eng: 88, math: 92
        // '이몽룡', kor: 70, eng: 75, math: 80
        // ② 각 학생의 평균 점수를 계산해 <p>  태그에 출력하시오.
        // ③ 저장할 파일명은 Ex_Object04.html 로 작성하시오.
        let student01 = {name :'홍길동', kor: 90, eng: 80, math: 85};
        let student02 = {name :'성춘향', kor: 95, eng: 88, math: 92};
        let student03 = {name :'이몽룡', kor: 70, eng: 75, math: 80};
        let students = [student01, student02, student03]
        let printHtml = '';
        for (let i = 0; i < students.length; i++) {
            let average = (students[i].kor + students[i].eng + students[i].math)/students.length;
            printHtml += `<p>${students[i].name} 학생의 평균점수 : ${average.toFixed(2)}</p>`;
        }
        document.getElementById('app').innerHTML = printHtml;



    </script>
</body>
</html>
