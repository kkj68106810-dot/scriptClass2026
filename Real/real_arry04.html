<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>

    </style>
</head>
<body>
    <!--힌트-->
    <!--투표자 이름과 득표수를 저장하는 배열을 따로 만들어라-->
    <!--색 지정은 <span class=‘color’>태그 이용하라-->
    <!--설명: -->
    <!--후보자 이름 배열과 투표 수 배열을 만들어 투표 결과를 출력하고, 가-->
    <!--장 많이 얻은 후보자를 표시하세요.-->
    <!--조건:-->
    <!--CSS로 1등 후보자 강조-->
    <!--HTML 버튼 클릭 시 각 후보자 투표 수 출력-->


    <h4>책 재고 현황</h4>
    <button onclick="productsPrint()">재고 확인</button>
    <div id="result"></div>

    <script>
        let products = ['노트북','마우스','모니터','키보드'];
        let prices = [120000, 30000, 80000, 40000];
        let resultHtml = '<table><tr><th>상품</th><th>가격</th><th>등급</th></tr>';

        function productsPrint() {
            products.forEach((item, idx) => {
                console.log(item, idx);
                if(prices[idx] >= 50000 ) {
                    resultHtml += `<tr><td>${products[idx]}</td><td>${prices[idx]}</td><td><span class="color-red">고가</span></td></tr>`;
                } else {
                    resultHtml += `<tr><td>${products[idx]}</td><td>${prices[idx]}</td><td><span class="color-blue">저가</span></td></tr>`;
                }
            })
            document.getElementById('result').innerHTML = resultHtml;
        }



    </script>

</body>
</html>
