<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>실무 2차원 배열 문제</title>
    <style>
        table {
            border-collapse: collapse;
            border: 1px solid gray;
            width: 300px;
            height: 300px;
            text-align: center;
        }
        tbody, th, td {
            border: 1px solid gray;
        }

    </style>
</head>
<body>
    <h2>자바스크립트 2차원 배열 실습예제</h2>
    <div class="container">
        <h3>1. 좌석배치표 (5x5)</h3>
        <div id="render"></div>
    </div>

    <script>
        // 1~25 까지 숫자를 2차원 배열에 출력
        // innerHtml 메소드 이용
        let arrs = Array.from(Array(5), () => new Array(5).fill(0));
        let result = '<table>';
        let arrNum = 1;
        let seatArr = arrs.map((element) => {
            return element.map((element2) => {
                element2 = arrNum;
                arrNum += 1;
                return element2;
            })
        })

        seatArr.forEach((element) => {
            result += '<tbody><tr>'
            element.forEach((element2) => {
                result += '<td>' + element2 + '</td>'
            })
            result += '</tr></tbody>'
        })
        result += '</table>';
        document.getElementById('render').innerHTML = result;

    </script>
</body>
</html>
