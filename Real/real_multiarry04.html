<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>실무 2차원 배열 문제</title>
    <style>
        .student-container {
            display: flex;
        }

    </style>
</head>
<body>
<div class="container">
    <h3>상품 재고 현황</h3>
    <div id="render"></div>
</div>

<script>

    let stock = [
        [10, 5, 8, 12], // 과일
        [20, 15, 18, 25], // 음료
        [30, 25, 28, 15]  // 간식
    ];

    let result = '<div>';

    stock.forEach((element, idx) => {
        let totalNum = 0;
        result += `<div class="student-container">카테고리 ${idx+1} :&nbsp&nbsp`
        element.map((element2, idx2) => {
            result += `<div>${element2}&nbsp&nbsp</div>`;
            totalNum += element2
        })
        result += `| 총재고 : ${totalNum}</div>`;
    })
    result += '</div>';

    // seatArr.forEach((element) => {
    //     result += '<tbody><tr>'
    //     element.forEach((element2) => {
    //         result += '<td>' + element2 + '</td>'
    //     })
    //     result += '</tr></tbody>'
    // })
    // result += '</table>';
    document.getElementById('render').innerHTML = result;

</script>

</body>
</html>
