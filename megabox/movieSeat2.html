<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메가박스</title>
    <link rel="stylesheet" href="movie.css">
</head>
<body>
<div class="container">
    <h2>빠른예매</h2>
    <div class="reserve-container">
        <div class="reserve-wrap">
            <div class="reserve-movie">
                <div class="reserve-title">
                    <p>관람인원선택</p>
                    <button class="btn" onclick="resetClick()">초기화</button>
                </div>
                <div class="reserve-info">
                    <div id="info-render" class="info-title">

                    </div>
                    <div class="seat-container">
                        <div class="screen">Screen</div>
                        <div class="seat-table">
                            <table>
                                <tbody id="seat-render">

                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>
            </div>
            <div class="reserve-seat">
                <div class="info-wrap">
                    <div class="title-wrap">
                        <div class="seat-title">타짜</div>
                        <div class="seat-info">
                            <div class="location">마곡</div>
                            <div class="info-box">6관 [Laser]</div>
                            <div>12:00 ~15:00</div>
                        </div>
                    </div>
                    <div class="img">
                        <img src="./images/target.jpg" alt="movie-poster">
                    </div>
                </div>
                <div class="seat-list">
                    <div class="reserve-info">
                        <div class="seat-status">
                            <div class="status seat-status1">

                            </div>
                            <div class="status seat-status2">

                            </div>
                            <div class="status seat-status3">

                            </div>
                            <div class="status seat-status3">

                            </div>
                            <div class="status seat-status3">

                            </div>
                        </div>
                    </div>
                    <div class="selected">
                        <div class="selected-title">선택</div>
                        <div class="selected-list" id="selected-list">


                        </div>
                    </div>
                </div>
                <div id="total-price" class="total-price">

                </div>
                <div class="reserve-btn">
                    <button class="btn" onclick="beforeClick()">이전</button>
                    <button class="btn" onclick="nextClick()">다음</button>
                </div>
            </div>
        </div>
    </div>

</div>
<script>
    let seats = Array.from(Array(10), () => new Array(10).fill(0));
    let columnArr = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
    // let seatHtml = ``;
    let infoHtml = ``;
    let seatRender = document.getElementById('seat-render');
    let infoRender = document.getElementById('info-render');
    let totalRender = document.getElementById('total-price');
    let selectedRender = document.getElementById('selected-list');
    let totalHtml = ``;
    let selectedHtml = ``;
    let seatHtml = ``
    // 15000, 8000, 6000
    // 일반, 경로, 우대
    let infoArr = [0, 0, 0];
    let priceArr = [15000, 8000, 6000];
    let selectedSeat = [];
    let countClass = 0;
    seatRenderFn()
    infoRenderFn()
    selectedRenderFn();

    // 0 번 일반, 1번 경로, 2번 우대
    function infoRenderFn() {
        infoArr.forEach((item, idx) => {
            let infoTitle = idx === 0 ? '일반' :
                idx === 1 ? '경로' : '우대'
            infoHtml += `<div class="info">${infoTitle}`
            infoHtml += `<div class="minus"><button class="btn" onClick="minusClick(${idx})">-</button><input type="number" value="${item}" id="total-count" disabled></div>
                  <div class="plus"><button class="btn" onclick="plusClick(${idx})">+</button></div>`
            infoRender.innerHTML = infoHtml
        })
    }


    function selectedRenderFn() {
        selectedHtml = ``
        selectedHtml += `<div class="selected-wrap">선택한 좌석</div><div class="selected-list-wrap"><div class="selected-wrap-seat">`;

        selectedSeat.forEach((item1, idx1) => {
            selectedHtml += ``;
            // item1.forEach((item2, idx2) => {
            selectedHtml += `<div class="selected-seat-right">-</div>`;
            // })
        })
        selectedHtml += `</div></div>`;
        selectedRender.innerHTML = selectedHtml
    }

    function returnNumArr(stringArr) {
        let returnArr = [[]];
        returnArr = stringArr.map(item => item.split(','));
        return returnArr;
    }

    function seatRenderFn(infoIdx, index1, index2) {
        // selectedSeat = [[]];
        let countClass = 0;
        console.log('seatRenderFn', infoIdx, index1, index2)
        if (infoIdx === -1) {
            alert("관람인원을 설정하세요.")
            infoIdx = -1;
            return;
        }
        seatHtml = ``;
        infoIdx = (infoIdx === undefined ? -1 : infoIdx);


        let selectedStr2;
        if (index1 !== undefined && index2 !== undefined) {
            selectedStr2 = index1 + "," + index2;
            if (selectedSeat.length > 8) {
                alert('8개 이상 추가할수 없습니다.')
                return;
            } else {
                selectedSeat.push(selectedStr2)
            }
        }


        let alertBoolean = false;
        let selectedNumArr = [[]];
        if (selectedSeat !== undefined) {
            selectedNumArr = returnNumArr(selectedSeat);
            // selectedNumArr.forEach((item, seleInd1) => {
            //     item.forEach((item2, seleInd2) => {
            //         seats[seleInd1][seleInd2] = 1;
            //     })
            // })
        }
        console.log(selectedNumArr[0])
        seats.forEach((item1, idx1) => {
            let selectedStr = '';
            seatHtml += `<tr>`
            item1.forEach((item2, idx2) => {
                if (countClass === infoIdx) {
                    if (!alertBoolean) {
                        alert('관람인원수를 초과하였습니다.');
                        alertBoolean = true;
                        // seatHtml += `<td class="row able-row" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, ${index1}, ${index2})">${idx2 + 1}</td>`;
                        seatHtml += `<td class="row able-row" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, undefined, undefined)">${idx2 + 1}</td>`;
                    }
                } else {
                    console.log(infoIdx, countClass)
                    if (idx2 === 0) {
                        seatHtml += `<td class="column">${columnArr[idx1][0]}</td>`
                    }

                    if (infoIdx === 1) {
                        console.log('infoIdx*********************************')
                        if (idx2 % 2 === 1) {
                            seatHtml += `<td class="row disable-row">X</td>`
                        } else {
                            seatHtml += `<td class="row able-row" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, ${idx1}, ${idx2})">${idx2 + 1}</td>`
                            // seatHtml += `<td class="row able-row selected-seat" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, undefined, undefined)">${idx2 + 1}</td>`
                            // selectedStr = idx1 + ',' + idx2;

                            // selectedSeat.push(selectedStr);
                            countClass++;
                        }
                    } else {
                        console.log('infoIdx Else --------------------------------------------')
                        seatHtml += `<td class="row able-row" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, ${idx1}, ${idx2})">${idx2 + 1}</td>`
                        // seatHtml += `<td class="row able-row selected-seat" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, undefined, undefined)">${idx2 + 1}</td>`
                        // selectedStr = idx1 + ',' + idx2;
                        // selectedSeat[0].push(selectedStr);
                        countClass++;
                    }


                }
                // 값이 0일때

                // if (idx2 === 0) {
                //     seatHtml += `<td class="column">${columnArr[idx1][0]}</td>`
                // }
                // if (infoIdx === 1) {
                //
                //     if (idx2 % 2 === 1) {
                //         seatHtml += `<td class="row disable-row">X</td>`
                //     } else {
                //         seatHtml += `<td class="row able-row" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, ${idx1}, ${idx2})">${idx2 + 1}</td>`
                //
                //     }
                // } else if (infoIdx === -1 || infoIdx > 1) {
                //     seatHtml += `<td class="row able-row" onclick="seatRenderFn(${infoIdx !== -1 ? infoIdx : -1}, ${idx1}, ${idx2})">${idx2 + 1}</td>`
                //
                // }


            })
            seatHtml += `</tr>`
        })
        totalRender.innerHTML = totalHtml;
        seatRender.innerHTML = seatHtml

    }

    function plusClick(idx) {
        infoArr[idx]++;
        document.getElementById('total-count').value = infoArr[idx];
        infoHtml = ``;
        let total = totalTicket(infoArr);
        seatRenderFn(total);
        infoRenderFn();
    }

    function totalTicket(arr) {
        let total = 0;
        arr.forEach(item => {
            total += item;
        })
        return total;
    }

    function totalPrice() {
        let returns = 0;
        infoArr.map((item, idx) => {
            returns += item * priceArr[idx];
        })
        return returns;
    }

    function minusClick(idx) {
        if (infoArr[idx] > 0) {
            infoArr[idx]--;
            document.getElementById('total-count').value = infoArr[idx];
            infoHtml = ``;
            let total = totalTicket(infoArr);
            seatRenderFn(total);
            infoRenderFn();
        } else {
            alert('0보다 작을 수 없습니다.')
        }
    }

    function beforeClick() {

    }

    function nextClick() {

    }

    function resetClick() {
        infoArr = [0, 0, 0];
        infoHtml = ``;
        infoRenderFn();
        seatRenderFn();
    }
</script>
</body>
</html>
